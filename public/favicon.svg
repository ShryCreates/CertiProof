  <line x1="24" y1="30" x2="40" y2="30" stroke="#5a6a9a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="24" y1="35" x2="36" y2="35" stroke="#5a6a9a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Seal / badge at bottom of cert -->
